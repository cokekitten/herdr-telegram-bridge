id = "tg.notify"
name = "Telegram Notify"
version = "0.2.0"
min_herdr_version = "0.7.0"
description = "Telegram push when an agent is done or blocked — reply to it and your text goes back into the agent."
platforms = ["macos", "linux"]

# Starts the reply poller with herdr. It spawns a detached process and returns
# immediately, so it never delays startup. The event hook below re-checks it.
[[startup]]
command = ["python3", "bot.py", "--ensure"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "notify.py"]

[[actions]]
id = "test"
title = "Send Telegram test message"
contexts = ["pane", "workspace"]
command = ["python3", "notify.py", "--test"]

[[actions]]
id = "bot-status"
title = "Telegram replies: poller status"
contexts = ["pane", "workspace"]
command = ["python3", "bot.py", "--status"]

[[actions]]
id = "bot-restart"
title = "Telegram replies: restart poller"
contexts = ["pane", "workspace"]
command = ["python3", "bot.py", "--restart"]
